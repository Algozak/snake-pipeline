<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake API</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10151c; color: #e8edf2; }
    body { max-width: 900px; margin: 32px auto; padding: 0 18px; }
    h1 { margin-bottom: 4px; } .muted { color: #9aa8b6; }
    main { display: grid; grid-template-columns: minmax(280px, 420px) minmax(240px, 1fr); gap: 28px; align-items: start; }
    section { background: #19232e; padding: 18px; border-radius: 12px; }
    canvas { width: 100%; max-width: 400px; display: block; background: #0b1117; border: 1px solid #3a4a59; image-rendering: pixelated; }
    input, button { font: inherit; padding: 9px 11px; border-radius: 7px; border: 1px solid #435568; margin: 4px 2px 4px 0; }
    input { width: min(100%, 210px); background: #0f1720; color: inherit; }
    button { cursor: pointer; background: #285d50; color: white; border: 0; }
    button:disabled { opacity: .45; cursor: not-allowed; } ol { padding-left: 25px; }
    #message { min-height: 1.4em; color: #f0c674; } .row { display: flex; flex-wrap: wrap; gap: 4px; }
    @media (max-width: 680px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Snake API</h1>
  <p class="muted">Sign in, play, and put your score on the leaderboard.</p>
  <section>
    <div class="row">
      <input id="username" autocomplete="username" placeholder="Username" minlength="3" maxlength="32">
      <input id="password" type="password" autocomplete="current-password" placeholder="Password (8+ chars)">
      <button id="register">Register</button><button id="login">Login</button>
    </div>
    <p id="message" role="status">Sign in to submit scores.</p>
  </section>
  <main style="margin-top:20px">
    <section>
      <h2>Game</h2>
      <p>Score: <strong id="score">0</strong> · Use arrow keys or WASD</p>
      <canvas id="game" width="400" height="400" aria-label="Snake game"></canvas>
      <button id="start">Start / Restart</button>
    </section>
    <section>
      <h2>Top 10</h2>
      <ol id="leaderboard"><li>Loading…</li></ol>
      <button id="refresh">Refresh scores</button>
    </section>
  </main>
<script>
  const $ = (id) => document.getElementById(id);
  const canvas = $("game"), ctx = canvas.getContext("2d"), cell = 20, tiles = 20;
  let token = null, snake = [], food = {}, direction = {x: 1, y: 0}, nextDirection = {x: 1, y: 0};
  let score = 0, timer = null, running = false;

  function say(message) { $("message").textContent = message; }
  function credentials() { return {username: $("username").value, password: $("password").value}; }
  async function request(path, options = {}) {
    const headers = {...(options.headers || {}), "Content-Type": "application/json"};
    if (token) headers.Authorization = `Bearer ${token}`;
    const response = await fetch(path, {...options, headers});
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
    return body;
  }
  $("register").onclick = async () => {
    try { await request("/api/register", {method: "POST", body: JSON.stringify(credentials())}); say("Account created. Log in to play for the leaderboard."); }
    catch (error) { say(error.message); }
  };
  $("login").onclick = async () => {
    try { const result = await request("/api/login", {method: "POST", body: JSON.stringify(credentials())}); token = result.access_token; say("Logged in. Your next score will be saved."); }
    catch (error) { token = null; say(error.message); }
  };
  function placeFood() {
    do { food = {x: Math.floor(Math.random() * tiles), y: Math.floor(Math.random() * tiles)}; }
    while (snake.some(part => part.x === food.x && part.y === food.y));
  }
  function draw() {
    ctx.fillStyle = "#0b1117"; ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = "#e5a34b"; ctx.fillRect(food.x * cell + 2, food.y * cell + 2, cell - 4, cell - 4);
    snake.forEach((part, index) => { ctx.fillStyle = index ? "#56b89a" : "#a5e6c9"; ctx.fillRect(part.x * cell + 1, part.y * cell + 1, cell - 2, cell - 2); });
  }
  function endGame() {
    running = false; clearInterval(timer); say(`Game over. Score: ${score}${token ? " — saving…" : " — log in to save it."}`);
    if (token) request("/api/scores", {method: "POST", body: JSON.stringify({score})})
      .then(() => { say(`Score ${score} saved.`); loadScores(); })
      .catch(error => say(`Game over. Score not saved: ${error.message}`));
  }
  function tick() {
    direction = nextDirection;
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
    if (head.x < 0 || head.y < 0 || head.x >= tiles || head.y >= tiles || snake.some(p => p.x === head.x && p.y === head.y)) return endGame();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score += 10; $("score").textContent = score; placeFood(); }
    else snake.pop();
    draw();
  }
  function startGame() {
    clearInterval(timer); snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
    direction = nextDirection = {x: 1, y: 0}; score = 0; $("score").textContent = score;
    placeFood(); draw(); running = true; say("Game started."); timer = setInterval(tick, 115);
  }
  const moves = {ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0]};
  document.addEventListener("keydown", event => {
    const move = moves[event.key]; if (!move || !running) return;
    event.preventDefault(); const [x, y] = move;
    if (x !== -direction.x || y !== -direction.y) nextDirection = {x, y};
  });
  async function loadScores() {
    try {
      const rows = await request("/api/scores/top"); $("leaderboard").replaceChildren();
      if (!rows.length) { $("leaderboard").innerHTML = "<li>No scores yet</li>"; return; }
      rows.forEach(row => { const item = document.createElement("li"); item.textContent = `${row.username} — ${row.score}`; $("leaderboard").append(item); });
    } catch (error) { $("leaderboard").innerHTML = "<li>Could not load scores</li>"; }
  }
  $("start").onclick = startGame; $("refresh").onclick = loadScores; loadScores(); draw();
</script>
</body>
</html>
